name: Touchstone Learning Loop

on:
  # 定时触发：每周一凌晨 2:00（UTC）运行
  schedule:
    - cron: '0 2 * * 1'
  # 手动触发：支持 workflow_dispatch 手动运行
  workflow_dispatch:
    inputs:
      force_ground_truth_rebuild:
        description: '强制重建真值集'
        required: false
        default: 'false'
        type: boolean

jobs:
  learn:
    runs-on: ubuntu-latest
    # 防止多个学习任务同时运行
    concurrency:
      group: touchstone-learning
      cancel-in-progress: true

    permissions:
      contents: write        # 写入经验库
      pull-requests: write   # 开经验库更新 PR（B3）
      issues: read           # 读取评论/审查数据

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -e .

      # 先校准：从最近已关闭 PR 重建人审裁决，产出 calibration.json（计数式蒸馏的奖励 + 退役信号）
      - name: Calibrate (produce calibration.json)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CALIBRATE_WINDOW: "50"
        run: python -m touchstone.calibrate

      - name: Run learning loop
        id: learn
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          # 旗舰模型（用于 TF-GRPO 的生成与内省）
          TOUCHSTONE_FLAGSHIP_MODEL: ${{ secrets.TOUCHSTONE_FLAGSHIP_MODEL }}
          # 可配置参数（从 Variables 读取）
          TOUCHSTONE_W_NOISE: ${{ vars.TOUCHSTONE_W_NOISE || '0.5' }}
          TOUCHSTONE_W_MISS: ${{ vars.TOUCHSTONE_W_MISS || '0.25' }}    # 对齐 learning_loop._W_MISS 默认（曾误为 1.0）
          TOUCHSTONE_PROTECTED_TYPES: ${{ vars.TOUCHSTONE_PROTECTED_TYPES || '' }}
          TOUCHSTONE_LEARNING_ENABLED: ${{ vars.TOUCHSTONE_LEARNING_ENABLED || 'true' }}
          TOUCHSTONE_GROUND_TRUTH_MIN: ${{ vars.TOUCHSTONE_GROUND_TRUTH_MIN || '10' }}
          # 类型白名单（c1：防 LLM 幻觉 finding_type 污染经验库）。默认关=现状不变：_resolve_taxonomy
          # 读本 env，空/未设 → taxonomy=None → merge_candidates 放行所有类型。开启前须先在
          # TOUCHSTONE_TAXONOMY_TYPES（或 pr-agent.yaml label 集）配齐规范类型——白名单非空时未知类型
          # fail-closed 丢弃。run #6 的 191 条里混有 LLM 幻觉型（PRA-A/B/C/OK/003…），类型表确定后置
          # vars.TOUCHSTONE_TAXONOMY_ENFORCE=true 即开始清洗（仅影响后续新蒸馏的候选，不改存量）。
          TOUCHSTONE_TAXONOMY_ENFORCE: ${{ vars.TOUCHSTONE_TAXONOMY_ENFORCE || '' }}
          TOUCHSTONE_TAXONOMY_TYPES: ${{ vars.TOUCHSTONE_TAXONOMY_TYPES || '' }}
          # 差距1a 位置级奖励（默认关=类型集合匹配=现状）。机制+数据管线+测试已就位（514f1ae）：
          # thread_findings 带 file/line → build_ground_truth 产 resolved_findings → make_gt_entry 产
          # human_adopted_positions → score_review 走位置级部分信用。仅留本 env 接通生产 run-path。
          # 开 vars.TOUCHSTONE_POSITIONAL_REWARD=true 即生效；部分信用权重经 POS_PARTIAL_* 可调。
          TOUCHSTONE_POSITIONAL_REWARD: ${{ vars.TOUCHSTONE_POSITIONAL_REWARD || '' }}
          TOUCHSTONE_POS_PARTIAL_SAMEFILE: ${{ vars.TOUCHSTONE_POS_PARTIAL_SAMEFILE || '0.5' }}  # 同 file 行距远的部分信用
          TOUCHSTONE_POS_PARTIAL_NOFILE: ${{ vars.TOUCHSTONE_POS_PARTIAL_NOFILE || '0.5' }}      # 无 file 可比时的部分信用
          # c3 rollout 成本控制（缓存 / 预算 / 并发；默认值同设计文档 §5.1，经 vars 可调）
          TOUCHSTONE_ROLLOUT_CACHE: ${{ vars.TOUCHSTONE_ROLLOUT_CACHE || '' }}       # 空=不缓存；'memory'=进程内；路径=文件缓存
          TOUCHSTONE_ROLLOUT_BUDGET: ${{ vars.TOUCHSTONE_ROLLOUT_BUDGET || '200' }}   # 每轮总 rollout 上限
          TOUCHSTONE_ROLLOUT_WORKERS: ${{ vars.TOUCHSTONE_ROLLOUT_WORKERS || '4' }}   # variant 批并发数
          # 差距3a 收敛检测（默认关=全量蒸馏=现状）。开 vars.TOUCHSTONE_CONVERGENCE=true 后：连续
          # N_STABLE 轮 text+lift 不变的 active 经验标 stable，下轮蒸馏跳过该 type。vars 可调阈值。
          TOUCHSTONE_CONVERGENCE: ${{ vars.TOUCHSTONE_CONVERGENCE || '' }}
          TOUCHSTONE_CONVERGE_N_STABLE: ${{ vars.TOUCHSTONE_CONVERGE_N_STABLE || '3' }}
          TOUCHSTONE_CONVERGE_LIFT_DRIFT: ${{ vars.TOUCHSTONE_CONVERGE_LIFT_DRIFT || '0.05' }}
          # 差距3b 增量水位（默认关=全量重建=现状）。开 vars.TOUCHSTONE_INCREMENTAL=true 后：只取数
          # number>水位 的新 PR（省 per-PR ~5 次 API 调用）；每 FULL_REFRESH_EVERY 轮强制全量对账兜底漂移。
          TOUCHSTONE_INCREMENTAL: ${{ vars.TOUCHSTONE_INCREMENTAL || '' }}
          TOUCHSTONE_FULL_REFRESH_EVERY: ${{ vars.TOUCHSTONE_FULL_REFRESH_EVERY || '4' }}
          # 差距2a 跨 PR 一致性（默认关=现状）。candidate 入池前要求来自≥N 个 PR 且跨 PR reward 方差小
          # （防"仅 1 PR 高 reward"的运气型 outlier 污染经验库）。默认 MIN=1（不限）、MAX_VAR 空（不检查）。
          TOUCHSTONE_DISTILL_MIN_SOURCE_PRS: ${{ vars.TOUCHSTONE_DISTILL_MIN_SOURCE_PRS || '1' }}
          TOUCHSTONE_DISTILL_MAX_REWARD_VAR: ${{ vars.TOUCHSTONE_DISTILL_MAX_REWARD_VAR || '' }}
          # 差距3b 差分时序 + 趋势回滚（默认关=现状）。开 vars.TOUCHSTONE_DIFFERENTIAL_METRICS=true 后：
          # 每轮 per-type lift 追加到 adoption-trend.json（时序可观测）；active 经验 lift 连续 AUTO_ROLLBACK_M
          # 轮下降 → 趋势退役（与 retire_on_negative_lift 静态阈值互补，提前下线慢性恶化经验）。
          TOUCHSTONE_DIFFERENTIAL_METRICS: ${{ vars.TOUCHSTONE_DIFFERENTIAL_METRICS || '' }}
          TOUCHSTONE_AUTO_ROLLBACK_M: ${{ vars.TOUCHSTONE_AUTO_ROLLBACK_M || '2' }}
          TOUCHSTONE_TREND_MAX_HISTORY: ${{ vars.TOUCHSTONE_TREND_MAX_HISTORY || '20' }}
          FORCE_REBUILD: ${{ github.event.inputs.force_ground_truth_rebuild || 'false' }}
        run: |
          python -m touchstone.learning_loop \
            --store data/experience_store.json \
            --build-ground-truth \
            --ground-truth data/ground_truth.json \
            --calib-agg calibration.json \
            --watermark data/learn_watermark.json \
            --trend data/adoption-trend.json \
            --output data/learning_report.json

      - name: Push experience update to bot branch + open PR
        # B3：不再直接 git push origin main（07-13/07-20 两次 non-fast-forward 失败根因）。
        # 改推滚动分支 + 开 PR；由 bot-pr-merge.yml 在 gate 绿 + 仅 data/*.json + head 匹配触发 run 时合入。
        if: steps.learn.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -u
          git config user.name "Touchstone Bot"
          git config user.email "touchstone-bot@users.noreply.github.com"
          BOT_BRANCH="bot/experience-update"
          git checkout -B "$BOT_BRANCH"
          # PRA round-2（learn.yml:122 "Assert mandatory outputs exist before committing"）：
          # experience_store.json 是 save_store 恒产——缺失即 learn 异常静默退出。若仍按存在性
          # add，会漏掉这个关键产物而提交空 commit（误报"经验已更新"）。强制断言：缺失即显式失败。
          [ -f data/experience_store.json ] || { echo "::error::data/experience_store.json 缺失：learn 异常未产出主产物，拒绝空提交"; exit 1; }
          git add data/experience_store.json
          # 可选产物按存在性 add（ground_truth 取决于 --build-ground-truth；learn_watermark 仅
          # TOUCHSTONE_INCREMENTAL=true 时写；adoption-trend 仅 TOUCHSTONE_DIFFERENTIAL_METRICS=true 时写）。
          for f in data/ground_truth.json data/learn_watermark.json data/adoption-trend.json; do
            [ -f "$f" ] && git add "$f"
          done
          # 不加 [skip ci]：要让 touchstone 评审在此 PR 上跑，gate 绿才触发自动合入
          git commit -m "chore(bot): weekly experience store + ground truth update" || { echo "无改动"; exit 0; }
          # 滚动分支：force-push 覆盖上一轮未合残留（learn.yml 有 concurrency 组，无并发）
          git push -f origin "$BOT_BRANCH"
          # 带 run id + 时间戳的 title/body，复用时刷新——防 stale 描述被合入（#141 review #4 Stale PR）
          TITLE="chore(bot): weekly experience store update (run $RUN_ID)"
          BODY=$(printf '由 learn.yml 定时产出。本轮 run: %s | 时间: %s\n\ngate 绿 + 仅含 data/*.json + head 匹配触发 run 时，由 bot-pr-merge.yml 自动合入（B3）。' "$RUN_ID" "$(date -u +%FT%TZ)")
          # force-push 后任何残留 open PR 都指向 stale commits，复用有竞态——关旧开新，
          # 保证 PR metadata 精确反映本轮新提交（#142 review：close stale PRs before creating new）。
          for n in $(gh pr list --head "$BOT_BRANCH" --base main --state open --json number -q '.[].number' 2>/dev/null || true); do
            gh pr close "$n" || true
          done
          # 开新 PR；真失败则标红（不静默丢——#141 review #3 Race condition）
          if ! gh pr create --base main --head "$BOT_BRANCH" --title "$TITLE" --body "$BODY"; then
            echo "::error::gh pr create 失败，本轮经验更新未开出 PR（push 已成功），请人工介入"
            exit 1
          fi

      - name: Upload learning report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learning-report
          path: data/learning_report.json